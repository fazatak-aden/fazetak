<script>

/* ==========================================
   FILE UPLOAD
========================================== */

const fileInput = document.getElementById('fileInput');
const fileList = document.getElementById('fileList');

fileInput.addEventListener('change', function () {

    const files = Array.from(this.files);

    if (files.length > 9) {

        alert('⚠️ يمكنك رفع 9 صور كحد أقصى.');

        this.value = '';
        fileList.innerHTML = '';

        return;
    }

    if (files.length === 0) {

        fileList.innerHTML = '';

        return;
    }

    let totalSize = 0;

    files.forEach(function(file) {
        totalSize += file.size;
    });

    let html =
        '✅ تم اختيار ' +
        files.length +
        ' صورة:<br>';

    files.forEach(function(file, index) {

        const sizeMB =
            (file.size / 1024 / 1024).toFixed(2);

        html +=
            '• ' +
            (index + 1) +
            '. ' +
            file.name +
            ' (' +
            sizeMB +
            ' MB)<br>';
    });

    html +=
        '<br>📦 الحجم الإجمالي: ' +
        (totalSize / 1024 / 1024).toFixed(2) +
        ' MB';

    fileList.innerHTML = html;
});


/* ==========================================
   GET CHECKED VALUES
========================================== */

function getCheckedValues(name) {

    return Array.from(
        document.querySelectorAll(
            'input[name="' + name + '"]:checked'
        )
    ).map(function(cb) {
        return cb.value;
    });

}


/* ==========================================
   GET RADIO VALUE
========================================== */

function getRadioValue(name) {

    const el =
        document.querySelector(
            'input[name="' + name + '"]:checked'
        );

    return el ? el.value : '';

}


/* ==========================================
   GET INPUT VALUE
========================================== */

function getInputValue(name) {

    const el =
        document.querySelector(
            '[name="' + name + '"]'
        );

    return el ? el.value : '';

}


/* ==========================================
   PREPARE IMAGE FOR WORD
========================================== */

async function prepareImageForWord(file) {

    return new Promise(function(resolve, reject) {

        const img = new Image();

        const url =
            URL.createObjectURL(file);

        img.onload = function() {

            try {

                URL.revokeObjectURL(url);

                const maxWidth = 1200;
                const maxHeight = 900;

                let width = img.naturalWidth;
                let height = img.naturalHeight;

                const ratio =
                    Math.min(
                        maxWidth / width,
                        maxHeight / height,
                        1
                    );

                width =
                    Math.round(width * ratio);

                height =
                    Math.round(height * ratio);

                const canvas =
                    document.createElement('canvas');

                canvas.width = width;
                canvas.height = height;

                const ctx =
                    canvas.getContext('2d');

                ctx.drawImage(
                    img,
                    0,
                    0,
                    width,
                    height
                );

                canvas.toBlob(
                    async function(blob) {

                        if (!blob) {

                            reject(
                                new Error(
                                    'تعذر تجهيز الصورة'
                                )
                            );

                            return;
                        }

                        const buffer =
                            await blob.arrayBuffer();

                        resolve({

                            buffer: buffer,

                            width: width,

                            height: height

                        });

                    },
                    'image/jpeg',
                    0.78
                );

            } catch (error) {

                reject(error);

            }

        };

        img.onerror = function() {

            URL.revokeObjectURL(url);

            reject(
                new Error(
                    'تعذر تحميل الصورة: ' +
                    file.name
                )
            );

        };

        img.src = url;

    });

}

/* ==========================================
   SUBMIT FORM
========================================== */

document
.getElementById('providerForm')
.addEventListener(
    'submit',
    async function(e) {

        e.preventDefault();

        const form = this;

        const btn =
            form.querySelector('.submit-btn');

        const originalText =
            btn.innerText;


        btn.innerText =
            '⏳ جاري تجهيز الطلب...';

        btn.disabled = true;
        btn.style.opacity = '0.7';


        try {


            /* ==================================
               VALIDATE FILES
            ================================== */

            const selectedFiles =
                Array.from(fileInput.files);


            if (selectedFiles.length > 9) {

                throw new Error(
                    'يمكن رفع 9 صور كحد أقصى.'
                );

            }


            for (
                const file
                of selectedFiles
            ) {

                const sizeMB =
                    file.size /
                    1024 /
                    1024;


                if (sizeMB > 25) {

                    throw new Error(
                        'الصورة "' +
                        file.name +
                        '" أكبر من 25MB.'
                    );

                }


                if (
                    !file.type.startsWith('image/')
                ) {

                    throw new Error(
                        'الملف "' +
                        file.name +
                        '" ليس صورة.'
                    );

                }

            }


            /* ==================================
               COLLECT DATA
            ================================== */

            const data = {

                fullName:
                    getInputValue('fullName'),

                email:
                    getInputValue('email'),

                phone:
                    getInputValue('phone'),

                residenceArea:
                    getInputValue('residenceArea'),

                workArea:
                    getInputValue('workArea'),

                specialties:
                    getCheckedValues('specialty'),

                otherSpecialty:
                    getInputValue('otherSpecialty'),

                servicesDetails:
                    getInputValue('servicesDetails'),

                experience:
                    getRadioValue('experience'),

                currentlyWorking:
                    getRadioValue('currentlyWorking'),

                workType:
                    getRadioValue('workType'),

                serviceAreas:
                    getCheckedValues('serviceAreas'),

                otherArea:
                    getInputValue('otherArea'),

                urgentOrders:
                    getRadioValue('urgentOrders'),

                workFrom:
                    getInputValue('workFrom'),

                workTo:
                    getInputValue('workTo'),

                hasPrices:
                    getRadioValue('hasPrices'),

                inspectionFee:
                    getInputValue('inspectionFee'),

                minFee:
                    getInputValue('minFee'),

                commission:
                    getRadioValue('commission'),

                hasPreviousWork:
                    getRadioValue('hasPreviousWork'),

                emergencyExp:
                    getRadioValue('emergencyExp'),

                fastArrival:
                    getRadioValue('fastArrival'),

                uniquePoints:
                    getInputValue('uniquePoints'),

                refName:
                    getInputValue('refName'),

                refPhone:
                    getInputValue('refPhone'),

                refRelation:
                    getInputValue('refRelation')

            };


            /* ==================================
               CREATE WORD LOCALLY
            ================================== */

            btn.innerText =
                '📄 جاري إنشاء ملف Word...';


            let wordBlob = null;


            try {

                wordBlob =
                    await createWordDocument(
                        data,
                        selectedFiles
                    );


                if (
                    wordBlob &&
                    typeof saveAs === 'function'
                ) {

                    const safeName =
                        data.fullName
                        .replace(
                            /[\\/:*?"<>|]/g,
                            '_'
                        );


                    saveAs(

                        wordBlob,

                        'استمارة_فزعتك_' +
                        safeName +
                        '.docx'

                    );

                }

            } catch (wordError) {

                console.error(
                    'Word error:',
                    wordError
                );

                alert(
                    '⚠️ تم تجهيز بيانات الطلب، لكن تعذر إنشاء ملف Word.\n\n' +
                    wordError.message
                );

            }


            /* ==================================
               SEND TEXT DATA ONLY TO FORMSPREE
               
               IMPORTANT:
               الصور وWord لا يتم إرسالهما إلى
               Formspree هنا.
            ================================== */

            btn.innerText =
                '📤 جاري إرسال البيانات...';


            const formData =
                new FormData();


            /* Personal */

            formData.append(
                'fullName',
                data.fullName
            );

            formData.append(
                'email',
                data.email
            );

            formData.append(
                'phone',
                data.phone
            );

            formData.append(
                'residenceArea',
                data.residenceArea
            );

            formData.append(
                'workArea',
                data.workArea
            );


            /* Specialty */

            formData.append(
                'specialties',
                data.specialties.join('، ') || '—'
            );

            formData.append(
                'otherSpecialty',
                data.otherSpecialty || '—'
            );

            formData.append(
                'servicesDetails',
                data.servicesDetails || '—'
            );


            /* Experience */

            formData.append(
                'experience',
                data.experience || '—'
            );

            formData.append(
                'currentlyWorking',
                data.currentlyWorking || '—'
            );

            formData.append(
                'workType',
                data.workType || '—'
            );


            /* Areas */

            formData.append(
                'serviceAreas',
                data.serviceAreas.join('، ') || '—'
            );

            formData.append(
                'otherArea',
                data.otherArea || '—'
            );

            formData.append(
                'urgentOrders',
                data.urgentOrders || '—'
            );


            /* Work time */

            formData.append(
                'workFrom',
                data.workFrom || '—'
            );

            formData.append(
                'workTo',
                data.workTo || '—'
            );


            /* Prices */

            formData.append(
                'hasPrices',
                data.hasPrices || '—'
            );

            formData.append(
                'inspectionFee',
                data.inspectionFee || '—'
            );

            formData.append(
                'minFee',
                data.minFee || '—'
            );

            formData.append(
                'commission',
                data.commission || '—'
            );


            /* Previous work */

            formData.append(
                'hasPreviousWork',
                data.hasPreviousWork || '—'
            );


            /* Additional */

            formData.append(
                'emergencyExp',
                data.emergencyExp || '—'
            );

            formData.append(
                'fastArrival',
                data.fastArrival || '—'
            );

            formData.append(
                'uniquePoints',
                data.uniquePoints || '—'
            );


            /* Reference */

            formData.append(
                'refName',
                data.refName || '—'
            );

            formData.append(
                'refPhone',
                data.refPhone || '—'
            );

            formData.append(
                'refRelation',
                data.refRelation || '—'
            );


            /* Subject */

            formData.append(
                '_subject',
                'طلب تسجيل جديد من فزعتك: ' +
                data.fullName
            );


            /* File information */

            formData.append(
                'number_of_photos',
                String(selectedFiles.length)
            );


            formData.append(
                'word_document_status',
                wordBlob
                    ? 'تم إنشاء ملف Word على جهاز مقدم الطلب'
                    : 'تعذر إنشاء ملف Word'
            );


            /* ==================================
               SEND
            ================================== */

            const response =
                await fetch(

                    form.action,

                    {

                        method: 'POST',

                        body: formData,

                        headers: {

                            'Accept':
                                'application/json'

                        }

                    }

                );


            /* ==================================
               CHECK RESPONSE
            ================================== */

            if (!response.ok) {

                let errorMessage =
                    'فشل إرسال البيانات.';

                try {

                    const result =
                        await response.json();


                    if (
                        result &&
                        result.errors &&
                        result.errors.length
                    ) {

                        errorMessage =
                            result.errors
                            .map(function(error) {

                                return error.message;

                            })
                            .join('\n');

                    }

                } catch (_) {}


                throw new Error(

                    errorMessage +
                    '\nHTTP ' +
                    response.status

                );

            }


            /* ==================================
               SUCCESS
            ================================== */

            const modal =
                document.getElementById(
                    'successModal'
                );


            /* عدّل نص الرسالة */

            const modalText =
                modal.querySelector(
                    '.modal-text'
                );


            modalText.innerHTML =

                'تم استلام بياناتك بنجاح.';

            if (selectedFiles.length > 0) {

                modalText.innerHTML +=

                    '<br><br>' +

                    '📷 تم تجهيز ' +
                    selectedFiles.length +
                    ' صورة داخل ملف Word على جهازك.' +

                    '<br><br>' +

                    '📄 تم تنزيل ملف Word تلقائيًا.' +

                    '<br><br>' +

                    'سيقوم فريق فزعتك بمراجعة البيانات والتواصل معك.';

            } else {

                modalText.innerHTML +=

                    '<br><br>' +

                    '📄 تم تجهيز ملف Word وتنزيله على جهازك.' +

                    '<br><br>' +

                    'سيقوم فريق فزعتك بمراجعة البيانات والتواصل معك.';

            }


            modal
                .classList
                .add('active');


            form.reset();

            fileList.innerHTML = '';


        } catch (err) {


            console.error(
                'Submission error:',
                err
            );


            alert(

                '❌ لم يتم إرسال الطلب.\n\n' +

                (
                    err.message ||
                    'حدث خطأ غير معروف'
                )

            );


        } finally {


            btn.innerText =
                originalText;

            btn.disabled =
                false;

            btn.style.opacity =
                '1';

        }

    }
);


/* ==========================================
   CLOSE MODAL
========================================== */

function closeModal() {

    document
        .getElementById('successModal')
        .classList
        .remove('active');

}

</script>
